<!-- SES フィルターのアイコン（16px）。assets/icon.svg から、16px で潰れる網目と粒を省いたもの -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- ふるいの網 -->
  <ellipse cx="8" cy="9" rx="7.25" ry="2.5" fill="#D5F1EB"/>
  <!-- ふるいの縁（奥） -->
  <path d="M.75 9A7.25 2.5 0 0 1 15.25 9" fill="none" stroke="#12A594"/>
  <!-- 残った求人票 -->
  <rect x="3.5" y="1.5" width="9" height="10" rx="1.5" fill="#FFFFFF" stroke="#0B7A6C"/>
  <path d="M5.5 4.5H10.5M5.5 6.5H8.5" fill="none" stroke="#0B7A6C"/>
  <!-- ふるいの枠（手前） -->
  <path d="M.75 9A7.25 2.5 0 0 0 15.25 9V11.5A7.25 2.5 0 0 1 .75 11.5Z" fill="#12A594"/>
</svg>

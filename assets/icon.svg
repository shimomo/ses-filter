<!-- SES フィルターのアイコン（32px 以上）。ふるいの上に、手元に残す求人票が 1 枚残る。PNG は node scripts/render-icons.ts で public/icon/ に書き出す -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="mesh"><ellipse cx="64" cy="58" rx="54" ry="16"/></clipPath>
  </defs>
  <!-- ふるいの網 -->
  <ellipse cx="64" cy="58" rx="58" ry="20" fill="#D5F1EB"/>
  <g clip-path="url(#mesh)" fill="none" stroke="#7ACBBD" stroke-width="3.5">
    <path d="M-28 40L8 76M-14 40L22 76M0 40L36 76M14 40L50 76M28 40L64 76M42 40L78 76M56 40L92 76M70 40L106 76M84 40L120 76M98 40L134 76M112 40L148 76"/>
    <path d="M6 40L-30 76M20 40L-16 76M34 40L-2 76M48 40L12 76M62 40L26 76M76 40L40 76M90 40L54 76M104 40L68 76M118 40L82 76M132 40L96 76M146 40L110 76"/>
  </g>
  <!-- ふるいの縁（奥） -->
  <path d="M6 58A58 20 0 0 1 122 58" fill="none" stroke="#12A594" stroke-width="7"/>
  <!-- 残った求人票 -->
  <rect x="35" y="6" width="58" height="62" rx="8" fill="#FFFFFF" stroke="#0B7A6C" stroke-width="7"/>
  <path d="M49 24H79M49 38H70" fill="none" stroke="#0B7A6C" stroke-width="7" stroke-linecap="round"/>
  <!-- ふるいの枠（手前） -->
  <path d="M6 58A58 20 0 0 0 122 58V84A58 20 0 0 1 6 84Z" fill="#12A594"/>
  <!-- 網を抜けて落ちる粒 -->
  <circle cx="52" cy="116" r="5.5" fill="#8ED3C6"/>
  <circle cx="76" cy="120" r="4.5" fill="#8ED3C6"/>
</svg>
